<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;color:light-dark(#163142,#dce8ef);padding:18px}pre{white-space:pre-wrap;word-break:break-word}a{display:inline-block;background:#b3f17f;color:#17251a;padding:12px 16px;border-radius:8px;text-decoration:none}small{opacity:.7}</style><h2>MCP-OTel repair</h2><p id="status">Waiting for repair state…</p><pre id="checks"></pre><a id="review" hidden target="_blank" rel="noopener noreferrer">Review and approve this tested version</a><p><small>Approval is checked by the server against the exact PR, artifact and checks. Telemetry text is untrusted evidence.</small></p><script>
let rpc=0,initialized=false;const send=(method,params)=>{const id=++rpc;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return id;};
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(m?.id===1&&m.result&&!initialized){initialized=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');}if(m?.method==='ui/notifications/tool-result'){const r=m.params?.structuredContent;if(!r)return;document.getElementById('status').textContent='Status: '+r.status;document.getElementById('checks').textContent=JSON.stringify({version:r.version_hash,checks:r.snapshot?.checks,result:r.result},null,2);try{const u=new URL(r.review_url);if(u.protocol==='https:'&&u.pathname.startsWith('/repairs/')){const a=document.getElementById('review');a.href=u.href;a.hidden=false;a.onclick=event=>{event.preventDefault();send('ui/open-link',{url:u.href});};}}catch{}}});
send('ui/initialize',{appInfo:{name:'mcp-otel-repair',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
</script></html>
